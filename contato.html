<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">
  <title>Nosso Contato</title>

  <style>
    main { flex: 1; }
    html, body { height: 100%; }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Lora', serif;
    }

    body {
      background-color: #f7f5f2;
      background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
      background-size: 300px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #f7f5f2;
      color: #2e2e2e;
      padding: 10px 20px;
      border-bottom: 1px solid #e6ded3;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    h1, h2 {
      font-family: 'Playfair Display', serif;
    }

    header h1 img {
      height: 70px;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      color: #5a5a5a;
      margin: 0 15px;
      text-decoration: none;
      font-weight: 500;
    }

    nav a:hover {
      color: #c65d3b;
    }

    .hero {
      background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('background.jpg') center/cover no-repeat;
      height: 40vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
      text-align: center;
    }

    .hero h1 {
      font-size: 2.5em;
    }

    .section {
      padding: 50px 20px;
      text-align: center;
    }

    .contato-box {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      border: 1px solid #efe8df;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .contato-box h2 {
      margin-bottom: 10px;
    }

    .contato-box > p {
      margin-bottom: 20px;
      color: #5a5a5a;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      text-align: left;
    }

    label {
      font-weight: 500;
      color: #3f3f3f;
      margin-bottom: -8px;
    }

    input,
    textarea {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ddd;
      font-size: 1em;
      width: 100%;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #c65d3b;
    }

    textarea {
      resize: none;
      height: 120px;
    }

    .btn {
      background-color: #a5511f;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
      font-size: 1em;
    }

    .btn:hover {
      background-color: #8a5a44;
    }

    .email-link {
      color: #a5511f;
      text-decoration: none;
    }

    .email-link:hover {
      color: #8a5a44;
      text-decoration: underline;
    }

    .copyright {
      position: fixed;
      top: 12px;
      left: 15px;
      color: #8a8178;
      font-size: 0.75em;
      letter-spacing: 0.5px;
      opacity: 0.7;
      z-index: 999;
    }
  </style>

</head>

<body>

  <header>
    <h1>
      <a href="inicio.html">
        <img src="logo.png" alt="logotipo">
      </a>
    </h1>

<nav>
  <a href="navegar.html">Navegar</a>
  <a href="sobre.html">Sobre</a>
  <a href="contato.html">Contato</a>
</nav>

  </header>

  <section class="hero">
    <div>
      <h1>Nosso Contato</h1>
      <p>Fale conosco</p>
    </div>
  </section>

  <section class="section">
    <div class="contato-box">

  <h2>Entre em contato</h2>

  <p>
    Preencha o formulário abaixo para falar conosco!
  </p>

  <form action="enviar_contato.php" method="POST">

    <label for="nome">Nome</label>
    <input
      type="text"
      id="nome"
      name="nome"
      placeholder="Digite seu nome"
      required
    >

    <label for="email">E-mail</label>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="Digite seu e-mail"
      required
    >

    <label for="assunto">Assunto</label>
    <input
      type="text"
      id="assunto"
      name="assunto"
      placeholder="Digite o assunto"
      required
    >

    <label for="mensagem">Mensagem</label>
    <textarea
      id="mensagem"
      name="mensagem"
      placeholder="Digite sua mensagem"
      required
    ></textarea>

    <button type="submit" class="btn">
      Enviar mensagem
    </button>

  </form>

  <p style="margin-top: 20px;">
    Ou envie um e-mail diretamente para
    <a
      href="mailto:projetoateliweb2026@gmail.com"
      class="email-link"
    >
      projetoateliweb2026@gmail.com
    </a>
  </p>

</div>

  </section>

  <div class="copyright">
    © 2026 AteliWeb - Todos os direitos reservados
  </div>

</body>
</html>
