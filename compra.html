<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finalizar Compra</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
	<style>
		body {
			font-family: 'Lora', serif;
			background-color: #f7f5f2;
			margin: 0;
			padding: 0;
		}

		.container {
			max-width: 900px;
			margin: 40px auto;
			padding: 20px;
		}

		h1 {
			font-family: 'Playfair Display', serif;
			text-align: center;
			margin-bottom: 30px;
		}

		form {
			display: flex;
			flex-direction: column;
			gap: 20px;
			background: #fff;
			padding: 25px;
			border-radius: 12px;
			box-shadow: 0 5px 15px rgba(0,0,0,0.1);
		}

		label { font-weight: 500; }
	
		input, textarea {
			width: 100%;
			padding: 10px;
			border-radius: 6px;
			border: 1px solid #ccc;
			font-size: 1em;
		}

		textarea { resize: vertical; }

		button {
			padding: 12px;
			background-color: #a5511f;
			color: white;
			border: none;
			border-radius: 6px;
			cursor: pointer;
			font-size: 1em;
			transition: background 0.2s;
		}
	
		button:hover { background-color: #8a5a44; }

		/* resumo do carrinho */
		.cart-summary {
			margin-top: 20px;
			border-top: 1px solid #ccc;
			padding-top: 15px;
		}

		.cart-item {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 8px;
		}
	
		.cart-item span:first-child { font-weight: 500; }
	
		#total {
			text-align: right;
			font-weight: 600;
			color: #a5511f;
			font-size: 1.1em;
			margin-top: 10px;
		}

		/* responsivo */
		@media(min-width:770px){
			form {
				flex-direction: row;
				gap: 30px;
			}
		
			.form-fields {
				flex: 2;
				display: flex;
				flex-direction: column;
				gap: 15px;
			}
		
			.cart-summary { flex: 1; }
		
		}
	</style>
</head>
<body>

	<div class="container">
	<h1>Finalizar Compra</h1>
		<form id="checkout-form">
			<div class="form-fields">
				<label for="name">Nome completo</label>
				<input type="text" id="name" name="name" required>

				<label for="email">E-mail</label>
				<input type="email" id="email" name="email" required>

				<label for="phone">Telefone</label>
				<input type="tel" id="phone" name="phone" required>

				<label for="address">Endereço</label>
				<textarea id="address" name="address" rows="3" required></textarea>
			</div>

			<div class="cart-summary">
				<h2>Resumo do pedido</h2>
				<div id="cart-items"></div>
				<div id="total"></div>
			</div>

			<button type="submit">Enviar pedido</button>
		</form>
	</div>

	<script>

		let cart = JSON.parse(localStorage.getItem("cart")) || [];

		function formatPrice(price){ return price.toFixed(2).replace(".", ","); }

		function renderCart(){
			const cartItemsDiv = document.getElementById("cart-items");
			const totalDiv = document.getElementById("total");
			cartItemsDiv.innerHTML = "";
			let total = 0;

			cart.forEach(item => {
				const subtotal = item.price * item.quantity;
				total += subtotal;
				const div = document.createElement("div");
				div.classList.add("cart-item");
				div.innerHTML = `
					<span>${item.name}(${item.quantity}×)</span>
					<span> R$ ${formatPrice(subtotal)}</span>
				`;
				
				cartItemsDiv.appendChild(div);
				
			});

			totalDiv.innerText = "Total: R$ " + formatPrice(total);
		}

		renderCart();

		document.getElementById("checkout-form").addEventListener("submit", function(e) {
			e.preventDefault();
		
			if(cart.length === 0){
				alert("Seu carrinho está vazio");
				return;
			}

			const formData = {
				name: this.name.value,
				email: this.email.value,
				phone: this.phone.value,
				address: this.address.value,
				cart: cart
			};

			console.log("Pedido enviado: ", formData);
		
			alert("Pedido enviado com sucesso");

			localStorage.removeItem("cart");
			window.location.href = "inicio.html";
		});
	
	</script>
</body>
</html>
