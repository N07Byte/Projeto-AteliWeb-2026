<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Lora:wght@400;500&display=swap" rel="stylesheet">
  <title>Navegar Produtos</title>
  <style>
    main { flex: 1; }

    html, body { height: 100%; }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Lora', serif;
    }

    body {
      background-color: #f7f5f2;
      background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
      background-size: 300px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #f7f5f2;
      display: flex;
      color: #2e2e2e;
      padding: 15px 20px;
      border-bottom: 1px solid #e6ded3;
      flex-direction: column; /* empilha logo + menu */
      text-align: center;
      align-items: center; /* centraliza horizontalmente */
      padding: 10px 20px;
    }

    h1, h2, h3 {
      font-family: 'Playfair Display', serif;
      letter-spacing: 0.5px;
    }

    header h1 img { height: 70px; }

    nav { margin-top: 10px; }

    nav a {
      color: #5a5a5a;
      margin: 0 15px;
      text-decoration: none;
      font-weight: 500;
    }

    nav a:hover { color: #c65d3b; }

    .hero h1 { font-size: 3em; }

    .section {
      padding: 50px 20px;
      text-align: center;
    }

    .pesquisa {
      max-width: 600px;
      margin: 25px auto 10px;
      padding: 0 20px;
    }

    #campo-pesquisa {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid #e6ded3;
      border-radius: 8px;
      background: #ffffff;
      color: #2e2e2e;
      font-family: 'Lora', serif;
      font-size: 1em;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #campo-pesquisa:focus {
      border-color: #c65d3b;
      box-shadow: 0 0 0 3px rgba(198, 93, 59, 0.1);
    }

    #resultado-pesquisa {
      text-align: center;
      color: #777;
      font-size: 0.9em;
      margin: 10px 0 20px;
    }

    .produtos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      padding: 20px;
    }

    .produto {
      background-color: #ffffff;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #efe8df;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      transition: transform 0.2s;
    }

    .produto:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .produto img {
      width: 100%;
      border-radius: 10px;
    }

    .produto h3 { margin: 10px 0; }

    .btn {
      background-color: #a5511f;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn:hover {
      background-color: #8a5a44;
      transform: translateY(-1px);
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease;
      z-index: 10; /* importante */
    }

    .overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .cart {
      position: fixed;
      right: -320px; /*começa escondido */
      top: 0;
      width: 300px;
      height: 100%;
      background: #ffffff;
      z-index: 20; /* maior que o overlay */
      transition: right 0.3s ease;
      text-align: center;
      padding: 20px;
    }

    /* quando estiver aberto */
    .cart.toggle { right: 0; }

    .cart h2 { margin-bottom: 15px; }

    /* lista de items do carrinho */
    #cart-items {
      list-style: none;
      padding: 0;
      text-align: center;
      margin-bottom: 20px;
    }

    #cart-items li {
      display: grid;
      grid-template-columns: 50px 1fr auto auto auto;
      justify-content: center;
      align-items: center;
      background: #f7f5f2;
      border: 1px solid #efe8df;
      border-radius: 8px;
      padding: 10px 20px;
      margin-bottom: 10px;
      gap: 10px;
      font-size: 0.9em;
    }

    /* nome do produto */
    .item-name {
      display: block;
      flex: 1;
      text-align: left;
    }

    /* preço */
    .item-price {
      margin: 0 10px;
      color: #a5511f;
      font-weight: 500;
      font-size: 0.85em;
      color: #777;
    }

    /* botão de remover */
    .remove-btn {
      background: none;
      border: none;
      color: #c65d3b;
      font-size: 16px;
      cursor: pointer;
    }

    /* total */
    #total {
      margin-top: 15px;
      font-size: 1.1em;
      font-weight: 500;
    }
  
    .item-img {
      width: 50px;
      height: 50px;
      object-fit: cover;
    }

    /* informações do produto */
    .item-info { text-align: left; }

    /* controles + - */
    .item-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .item-controls button {
      background: #e6ded3;
      border: none;
      padding: 4px 8px;
      cursor: pointer;
      border-radius: 4px;
    }

    /* subtotal */
    .item-subtotal {
      font-weight: 500;
      color: #a5511f;
    }

    /* remover */
    .remove-btn {
      background: none;
      border: none;
      color: #c65d3b;
      cursor: pointer;
      font-size: 16px;
    }

    /* botões principais */
    .cart .btn {
      display: block;
      width: 80%;
      margin: 10px auto;
    }

    /* botão fechar */
    .cart button:not(.btn) {
      display: block;
      margin: 10px auto;
    }

    #cart-items button {
      margin-left: 10px;
      background: none;
      border: none;
      color: red;
      cursor: pointer;
    }

    #toggle-cart-btn {
      position: fixed;
      right: 20px;
      bottom: 80px;
      z-index: 30;
      background-color: #c65d3b;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 12px 18px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
  
    #checkout-btn { display: none; /* começa invisível */ }

    .copyright {
      position: fixed;
      top: 12px;
      left: 15px;
      color: #8a8178;
      font-size: 0.75em;
      letter-spacing: 0.5px;
      opacity: 0.7;
      z-index: 999;
    }

    ::selection {
      background: #c65d3b;
      color: white;
    }
  </style>
  
</head>

<body>

<header>
  <h1>
    <a href="inicio.html">
      <img src="logo.png" alt="logotipo">
    </a>
  </h1>

  <nav>
    <a href="navegar.html">Navegar</a>
    <a href="sobre.html">Sobre</a>
    <a href="contato.html">Contato</a>
  </nav>
  <button id="toggle-cart-btn" onclick="toggleCart()">🛒</button>
</header>

<section class="section">
  <h2>Navegar Produtos</h2>

  <div class="pesquisa">
    <input
        type="search"
        id="campo-pesquisa"
        placeholder="Pesquisar produtos"
        autocomplete="off"
    >
</div>

<p id="resultado-pesquisa"></p>

  <div class="produtos"></div>
</section>

<div id="cart" class="cart">
  <h2>Carrinho</h2>
  <ul id="cart-items"></ul>
  <p id="total">Total: R$ 0,00</p>
  <button id="checkout-btn" class="btn" onclick="goToCheckout()">Finalizar compra</button>
  <button class="btn" onclick="clearCart()">Limpar carrinho</button>
</div>

<div id="overlay" class="overlay" onclick="toggleCart()"></div>

<script>
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  
  function openCart() {
    document.getElementById("cart").classList.add("toggle");
    document.getElementById("overlay").classList.add("active");
}

  function toggleCart() {
    const cartEl = document.getElementById("cart");
    const overlay = document.getElementById("overlay");

    cartEl.classList.toggle("toggle");
    overlay.classList.toggle("active");
  }

  function saveCart() {
    localStorage.setItem("cart", JSON.stringify(cart));
  }

  function formatPrice(price) {
    return price.toFixed(2).replace(".", ",");
  }

  function addToCart(name, price, image) {
    const existing = cart.find(item => item.name === name);

    if (existing) {
      existing.quantity++;
    } else {
      cart.push({ name, price, image, quantity: 1 });
    }

    saveCart();
    renderCart();
    openCart(); /* abre o carrinho automaticamente quando adicionar um item a ele*/
  }

  function increaseQty(index) {
    cart[index].quantity++;
    saveCart();
    renderCart();
  }

  function decreaseQty(index) {
    if (cart[index].quantity > 1) {
      cart[index].quantity--;
    } else {
      cart.splice(index, 1);
    }
    saveCart();
    renderCart();
  }

  function removeItem(index) {
    cart.splice(index, 1);
    saveCart();
    renderCart();
  }

  function clearCart() {
    cart = [];
    saveCart();
    renderCart();
  }

  function renderCart() {
      const cartItems = document.getElementById("cart-items");
      const totalEl = document.getElementById("total");

      cartItems.innerHTML = "";
      let total = 0;

      cart.forEach((item, index) => {
        const subtotal = item.price * item.quantity;
        total += subtotal;

        const li = document.createElement("li");
        li.innerHTML = `
          <img src="${item.image}" class="item-img">
      
          <div class="item-info">
            <span class="item-name">${item.name}</span>
            <span class="item-price">R$ ${formatPrice(item.price)}</span>
          </div>

          <div class="item-controls">
            <button onclick="decreaseQty(${index})">−</button>
            <span>${item.quantity}</span>
            <button onclick="increaseQty(${index})">+</button>
          </div>

          <div class="item-subtotal">
            R$ ${formatPrice(subtotal)}
          </div>

          <button class="remove-btn" onclick="removeItem(${index})">✕</button>
        `;
        cartItems.appendChild(li);
      });
    
    /* mostrar ou esconder botão "Finalizar compra" */
    const checkoutBtn = document.getElementById("checkout-btn");
    if (cart.length > 0) {
      checkoutBtn.style.display = "block";
    } else {
      checkoutBtn.style.display = "none";
    }

    totalEl.innerText = "Total: R$" + formatPrice(total);
  }

  function goToCheckout() {
    if (cart.length === 0) {
      alert("Seu carrinho está vazio");
      return;
    }

    /* redirecionar para a página de checkout */
    window.location.href = "compra.html";
  }

  /* carregar ao abrir página */
  renderCart();

  /* sistema de pesquisa */
  const campoPesquisa = document.getElementById("campo-pesquisa");
  const listaProdutos = document.querySelector(".produtos");
  const resultadoPesquisa = document.getElementById("resultado-pesquisa");

  let tempoPesquisa;

  campoPesquisa.addEventListener("input", function () {
      clearTimeout(tempoPesquisa);

      const pesquisa = this.value.trim();

      tempoPesquisa = setTimeout(() => {
        buscarProdutos(pesquisa);
      }, 500);
  });

  async function buscarProdutos(pesquisa = "") {
    try {
      const resposta = await fetch("buscar_produtos.php?pesquisa=" + encodeURIComponent(pesquisa));

      if (!resposta.ok) {
        throw new Error("Erro na comunicação com o servidor");
      }

      const produtos = await resposta.json();

      listaProdutos.innerHTML = "";

      if (produtos.length === 0) {
        resultadoPesquisa.textContent = "Nenhum produto encontrado";

        return;
      }

      resultadoPesquisa.textContent = `${produtos.length} produto(s) encontrado(s)`;

      produtos.forEach(produto => {
        const card = document.createElement("div");

        card.className = "produto";

        card.innerHTML = `
          <img
            src="${produto.pro_imagem}"
            alt="${produto.pro_nome}"
          >

          <h3>${produto.pro_nome}</h3>

          <p>
            ${Number(produto.pro_preco).toLocaleString("pt-BR", {
              style: "currency",
              currency: "BRL"
            })}
          </p>

          <button class="btn">
            Comprar
          </button>
        `;

        const botao = card.querySelector(".btn");

        botao.addEventListener("click", () => {
          addToCart(produto.pro_nome, Number(produto.pro_preco), produto.pro_imagem);
        });

        listaProdutos.appendChild(card);
      });
    } catch (erro) {
      console.error(erro);
      
      resultadoPesquisa.textContent = "Não foi possível carregar os produtos";
    }
  }

  buscarProdutos();
</script>

<div class="copyright">
  © 2026 AteliWeb - Todos os direitos reservados
</div>

</body>
</html>
